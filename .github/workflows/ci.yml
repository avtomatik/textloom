name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest tests -v


  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: MyPy (src only)
        run: mypy src

  build_and_publish:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine tomli

      # -----------------------------
      # BUILD (single time only)
      # -----------------------------
      - name: Build package
        run: python -m build

      # -----------------------------
      # EXTRACT VERSION
      # -----------------------------
      - name: Get version
        id: meta
        run: |
          VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -----------------------------
      # CHECK PYPI
      # -----------------------------
      - name: Check PyPI
        id: pypi
        run: |
          NAME="textloom"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "Checking $NAME==$VERSION on PyPI..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/$NAME/$VERSION/json)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------
      # PUBLISH
      # -----------------------------
      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "No PyPI token found — skipping publish"
            exit 0
          fi
          twine upload dist/*

      # -----------------------------
      # SKIP MESSAGE
      # -----------------------------
      - name: Skip publish
        if: steps.pypi.outputs.exists == 'true'
        run: echo "Version already exists on PyPI — skipping publish"
