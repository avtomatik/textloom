[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textloom"
version = "0.1.0"
description = "Lightweight text processing utilities for normalization, transliteration, and deduplication"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Alexander"}
]

dependencies = []

[project.urls]
Homepage = "https://github.com/avtomatik/textloom"
Repository = "https://github.com/avtomatik/textloom"
Issues = "https://github.com/avtomatik/textloom/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "mypy",
  "ruff",
  "build",
  "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "tests/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
